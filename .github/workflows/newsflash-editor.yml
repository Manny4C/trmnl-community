name: Newsflash AI editor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: newsflash-editor
  cancel-in-progress: false
jobs:
  edit:
    if: vars.NEWSFLASH_AI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desk-editor/package-lock.json
      - run: npm ci --omit=dev
        working-directory: apps/desk-editor
      - run: node scripts/run-editor.mjs
        working-directory: apps/desk-editor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
