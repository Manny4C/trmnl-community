- keyname: author
  field_type: author_bio
  name: About Newsflash
  category: news
  description: Your interests, one important visual story. An off-device AI editor ranks recent stories from a bounded set of official sports, tech, AI, gaming, Tesla, creator and NASA feeds. Source images or video previews lead; original headlines, attribution and dates stay visible. A thumbnail is not necessarily an event frame. New or unreviewed stories use a labeled freshness fallback. Not comprehensive world news or a live video player. Public preference fields travel in URLs and may appear in hosting logs. No viewer API key required.
  github_url: https://github.com/Manny4C/trmnl-community
  learn_more_url: https://newsflash-trmnl.vercel.app
- keyname: interests
  field_type: string
  name: Your interests
  description: Comma-separated choices. Use technology, ai, gaming, baseball, basketball, ev, creators or space. Pick one or more. The website creates the exact mix for you.
  default: technology,ai,gaming,baseball,ev,creators,space
  maxlength: 100
- keyname: follow
  field_type: string
  optional: true
  name: Follow words (optional)
  description: Keep stories matching any word in the headline or feed description. For example Brewers, Roadster, Nintendo. Public interests only; not an arbitrary writing prompt.
  maxlength: 100
- keyname: news_window
  field_type: select
  name: News window
  default: '48'
  options:
  - Past 24 hours: '24'
  - Past 48 hours: '48'
  - Past 72 hours: '72'
