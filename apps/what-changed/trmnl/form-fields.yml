- keyname: author
  field_type: author_bio
  name: About The Daily TRMNL
  category: news,productivity
  description: Build a briefing from your interests. Use the website to include or exclude ten preset topics, add your own interests, and copy the generated prompt into News prompt below. Real attributed headlines and short source excerpts, new/updated-story history, and clear freshness. Global discovery uses the GDELT Project (https://www.gdeltproject.org/) alongside public source feeds. No personal API key required. Independent community project.
  github_url: https://github.com/Manny4C/trmnl-community
  learn_more_url: https://the-daily-trmnl.vercel.app
- keyname: news_prompt
  field_type: text
  name: Your news prompt
  description: Describe topics, companies, or places to follow. Add Avoid or Exclude for unwanted topics. Create a prompt with ten preset choices on the website, then paste it here.
  default: Find recent news about AI and technology.
  placeholder: AI startups, Y Combinator, and Nintendo. Avoid celebrity news.
  maxlength: 600
  rows: 4
- keyname: headline_count
  field_type: number
  name: Number of headlines
  description: Full screen shows up to this many matching stories. 1–3 gives more detail; 4–8 is a compact list; 9–20 uses two columns. Half and quadrant layouts show a smaller subset. Fewer matches can mean fewer headlines.
  default: 8
  min: 1
  max: 20
  step: 1
